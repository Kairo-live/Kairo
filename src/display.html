<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIRO Display</title>
    <!-- Non-blocking preload-then-swap — see index.html for why. This is the
         projector/output window, so it matters even more here: a stuck render
         means a blank screen mid-service, not just a slow app launch. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
          onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"></noscript>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            font-family: 'Manrope', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            /* This is a live broadcast output, not a page to read — verse
               text (and everything else on it) shouldn't be selectable at
               all. #kairo-label already had this individually; applying it
               here covers the actual content too. */
            -webkit-user-select: none;
            user-select: none;
        }

        #stage {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* News-ticker / large-scroll text layers (layer.scroll.enabled) — see
           buildLayerDOM below. Matches Theme Studio's own preview keyframe. */
        @keyframes kairo-marquee {
            from { transform: translateX(0); }
            to   { transform: translateX(-100%); }
        }

        /* Independently-controlled layers, PP-style: media (image/video) sits
           behind, the slide (theme background/text) on top of it, and the
           timer layer on top of that. Each clears/updates without touching
           the others — a running stage timer never disturbs the scripture or
           lyrics on the slide layer, and Clear Timer removes only this one. */
        #media-layer, #slide-layer, #timer-layer {
            position: absolute;
            inset: 0;
        }
        #media-layer { z-index: 0; }
        #slide-layer { z-index: 1; }
        #timer-layer { z-index: 2; pointer-events: none; }
        #timer-layer:empty { display: none; }
        #media-layer video, #media-layer img {
            position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
        }

        /* Layer transitions */
        .display-layer {
            transition: opacity 350ms ease, transform 350ms ease;
        }

        /* Transparent background (no-bg look) */
        body.transparent-bg {
            background: transparent;
        }

        /* KAIRO watermark */
        #kairo-label {
            position: fixed;
            bottom: 18px;
            right: 22px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.25em;
            color: rgba(255, 255, 255, 0.12);
            text-transform: uppercase;
            user-select: none;
            pointer-events: none;
            z-index: 9999;
        }

        /* Connection status */
        #conn-status {
            position: fixed;
            top: 14px;
            left: 18px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.2);
            opacity: 0;
            transition: opacity 400ms ease;
            z-index: 9999;
        }

        #conn-status.visible { opacity: 1; }
        #conn-status.reconnecting { color: rgba(245, 158, 11, 0.6); }
        #conn-status.connected { color: rgba(255, 255, 255, 0.15); }

        /* Timer/clock — a real third layer alongside #slide-layer and
           #media-layer (see clear-layer handling below), just rendered as
           a small fixed corner readout rather than a full-stage layer.
           Two independent badges, not one shared slot — a segment
           countdown and the live clock can be relevant at the same time
           and shouldn't fight over the same element, overwriting each
           other every tick. Same visual register as #kairo-label/
           #conn-status (fixed, high z-index, low-emphasis). */
        #timer-badge, #clock-badge {
            position: fixed;
            right: 18px;
            font-family: var(--mono, monospace);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.82);
            text-shadow: 0 1px 6px rgba(0,0,0,0.6);
            z-index: 9999;
        }
        #timer-badge { top: 14px; }
        /* Clock sits below the timer when both are showing, rather than
           overlapping it. */
        #clock-badge { top: 72px; }
        #timer-badge.hidden, #clock-badge.hidden { display: none; }
        /* Overtime — past the segment's end time but still running until
           explicitly stopped, so it reads as "running long," not broken. */
        #timer-badge.is-overtime { color: #ff5c5c; text-shadow: 0 1px 6px rgba(255,0,0,0.35); }
        #timer-badge.is-overtime .badge-label { color: rgba(255, 92, 92, 0.6); }
        /* Warning — inside the last minute, still counting down. A step
           between "normal" and "overtime" so the operator sees it coming
           rather than the color jumping straight from plain to red at 0. */
        #timer-badge.is-warning { color: #ffcf4d; text-shadow: 0 1px 6px rgba(255,196,0,0.3); }
        #timer-badge.is-warning .badge-label { color: rgba(255, 207, 77, 0.6); }
        /* The themed on-stage timer layer keeps the THEME's own colour — a
           warning/overtime state is signalled with a glow + gentle pulse, not
           by overriding the operator's chosen colour. (The fixed corner badge
           above, which is unthemed, still recolours since it has no theme to
           respect.) */
        [data-binding="timer"].is-warning  { text-shadow: 0 0 14px rgba(255,196,0,0.55); }
        [data-binding="timer"].is-overtime { text-shadow: 0 0 16px rgba(255,60,60,0.6); animation: timer-otp 1s ease-in-out infinite; }
        @keyframes timer-otp { 50% { opacity: 0.55; } }
        #timer-badge .badge-label, #clock-badge .badge-label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
            text-align: right;
        }
    </style>
</head>
<body>
    <div id="stage">
        <div id="media-layer"></div>
        <div id="slide-layer"></div>
        <div id="timer-layer"></div>
    </div>
    <div id="kairo-label">KAIRO</div>
    <div id="conn-status" class="visible reconnecting">Connecting…</div>
    <div id="timer-badge" class="hidden"></div>
    <div id="clock-badge" class="hidden"></div>

    <script src="design_space.js"></script>
    <script src="word_split.js"></script>
    <script src="color_utils.js"></script>
    <script>
    'use strict';

    // ── URL params (legacy fallback) ───────────────────────────────────────
    const params      = new URLSearchParams(location.search);
    const legacyLayout  = params.get('layout') || 'fullscreen';
    const legacyOpacity = parseInt(params.get('opacity') || '80', 10) / 100;

    // ── State ──────────────────────────────────────────────────────────────
    // Derive WS URL from the page origin (Node sidecar serves this file, so
    // location.host is always correct — and matches whichever port Tauri
    // picked at launch).
    const WS_URL = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}`;
    // Base delay for exponential backoff (see scheduleReconnect) — capped
    // low since this is a local sidecar process, not a remote network hop.
    const RECONNECT_BASE_DELAY = 1000;
    const RECONNECT_MAX_DELAY  = 8000;

    // Fetch the auth token from Tauri once at startup, then append it to the
    // WS URL. In a non-Tauri context the call no-ops and we connect unauthed
    // (server also treats auth as optional when its env var is absent).
    let AUTH_TOKEN = '';
    async function loadAuthToken() {
      try {
        const inv = window.__TAURI__?.core?.invoke || window.__TAURI__?.invoke;
        if (inv) AUTH_TOKEN = await inv('get_server_token');
      } catch {}
    }
    function authedWsUrl() {
      return AUTH_TOKEN
        ? WS_URL + '?token=' + encodeURIComponent(AUTH_TOKEN)
        : WS_URL;
    }

    let ws             = null;
    let reconnectTimer = null;
    let reconnectAttempts = 0;
    let currentVerseText = '';
    let currentVerseRef  = '';
    let currentTranslatedText = ''; // right-panel text for the Multi-Language theme
    let currentStyleByLayerId = {}; // per-slide, per-layer-id overrides (Full Edit) for whatever's currently shown
    let currentTimerText = ''; // last value sent for a 'timer'-bound layer — the per-second tick (handleActionBadge) updates the DOM directly and doesn't touch this
    let activeLook       = null;
    let pendingFade      = false;

    const stage      = document.getElementById('stage');
    const slideLayer = document.getElementById('slide-layer');
    const mediaLayer = document.getElementById('media-layer');
    const timerLayer = document.getElementById('timer-layer');
    const connStatus = document.getElementById('conn-status');

    // ── Media layer state (independent of the slide/text layer) ────────────
    let mediaMuted  = false;
    let mediaVolume = 1;
    let mediaSinkId = null;
    function currentMediaVideo() { return mediaLayer.querySelector('video'); }

    // ── Font loader ────────────────────────────────────────────────────────
    const loadedFonts = new Set(['Manrope', 'system-ui']);
    function loadGoogleFont(family) {
        if (!family || loadedFonts.has(family)) return;
        loadedFonts.add(family);
        const url = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(family)}:wght@100;200;300;400;500;600;700;800;900&display=swap`;
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = url;
        document.head.appendChild(link);
    }

    // hexToRgb/hexOpacity now come from color_utils.js, loaded via a <script>
    // tag above this one — shared with app.js/service.js, which had their own
    // slightly divergent copies of this same logic.

    // ── Free-canvas positioning ────────────────────────────────────────────
    // A layer may carry `pos: {x, y, w, h}` in 1920×1080 design-space pixels
    // (the Theme Studio canvas). When present it overrides the layout preset
    // for that layer: the element is placed absolutely at the equivalent
    // percentage of the real stage, so positions survive any output size.
    // h = 0 means "auto height" (text grows downward from y).
    // Shared with app.js/service.js — see design_space.js.
    const DESIGN_W = window.KAIRO_DESIGN_W, DESIGN_H = window.KAIRO_DESIGN_H;
    function applyPos(div, pos) {
        // `inset` is shorthand for top/right/bottom/left — assigning it
        // (even '') resets those longhands, which was silently wiping out
        // the left/top just set two lines above. Clear right/bottom
        // individually instead of touching the shorthand at all.
        div.style.left  = (pos.x / DESIGN_W * 100) + '%';
        div.style.top   = (pos.y / DESIGN_H * 100) + '%';
        div.style.width = (pos.w / DESIGN_W * 100) + '%';
        div.style.right = 'auto';
        div.style.bottom = 'auto';
        if (pos.h > 0) div.style.height = (pos.h / DESIGN_H * 100) + '%';
    }

    // ── Build layer DOM from look ──────────────────────────────────────────
    // `styleByLayerId` is a per-slide, per-layer-id override map (Kairo's
    // "Full Edit" feature) — a specific playlist item's specific slide can
    // override any text layer's position/font/align/color/shadow/outline/
    // visibility without touching the theme itself.
    function buildLayerDOM(look, verseText, verseRef, translatedText, styleByLayerId = {}, timerText = '', skipBackground = false) {
        const frag    = document.createDocumentFragment();
        const layout  = look.layout || 'fullscreen';
        let   isTransparent = false;

        // Item/slide-specific layers (Full-scale edit's per-slide custom
        // layers) ride along inside styleByLayerId rather than a parallel
        // field — appended last so they paint on top, same as every other
        // "new layer" convention.
        const layers = [...(look.layers || []), ...((styleByLayerId || {}).__customLayers || [])];
        // Only themes that actually pair a reference/translation caption with
        // a verse layer get the "no caption without a verse line" guard below
        // — a theme deliberately built with ONLY a reference/citation layer
        // (no verse layer at all) has nothing else to show, so its reference
        // must still paint even when verseText is empty. Same rule
        // paintLookLayers (service.js) applies for every preview.
        const hasVerseLayer = layers.some(l => l.type === 'text' && l.binding === 'verse' && l.visible !== false);
        layers.forEach(layer => {
            if (!layer.visible) return;

            // Image layer — always free-positioned, drawn in layer order.
            if (layer.type === 'image') {
                if (!layer.src) return;
                const div = document.createElement('div');
                div.className = 'display-layer';
                const p = layer.pos || { x: 0, y: 0, w: DESIGN_W, h: DESIGN_H };
                div.style.cssText = 'position:absolute;z-index:1;background-repeat:no-repeat;background-position:center;';
                div.style.backgroundImage = `url('${layer.src}')`;
                div.style.backgroundSize  = layer.fit === 'fill' ? '100% 100%' : (layer.fit || 'contain');
                div.style.opacity         = (layer.opacity ?? 100) / 100;
                if (layer.radius) div.style.borderRadius = (layer.radius / DESIGN_H * 100) + 'vh';
                applyPos(div, p);
                div.style.height = (p.h / DESIGN_H * 100) + '%';
                if (layer.rotation) div.style.transform = `rotate(${layer.rotation}deg)`;
                frag.appendChild(div);
                return;
            }

            if (layer.type === 'background') {
                // The timer layer is a transparent overlay on top of the live
                // slide — its theme's background must never paint over the
                // scripture/lyrics underneath.
                if (skipBackground) return;
                // Only a full-canvas background keys the output transparent —
                // a positioned shape with a transparent fill is just invisible.
                if (layer.fill === 'transparent') {
                    if (!layer.pos) isTransparent = true;
                    return;
                }

                const div = document.createElement('div');
                div.className = 'display-layer';
                div.style.cssText = 'position:absolute;inset:0;z-index:0;';

                if (layer.fill === 'solid') {
                    div.style.background = hexOpacity(layer.color, layer.opacity);
                } else if (layer.fill === 'gradient') {
                    const c1 = hexOpacity(layer.color,  layer.opacity);
                    const c2 = hexOpacity(layer.color2, layer.opacity);
                    div.style.background = `linear-gradient(${layer.angle}deg, ${c1}, ${c2})`;
                } else if (layer.fill === 'blur') {
                    div.style.background = hexOpacity(layer.color, layer.opacity);
                    div.style.backdropFilter    = 'blur(24px)';
                    div.style.webkitBackdropFilter = 'blur(24px)';
                }

                // Layout-specific background coverage. Each layout puts the
                // background in a different shape/position so the rendered
                // text overlay sits on top correctly.
                if (layout === 'lower-third') {
                    div.style.inset  = 'auto 0 0 0';
                    div.style.height = '40%';
                } else if (layout === 'ticker') {
                    div.style.inset  = 'auto 0 0 0';
                    div.style.height = '18%';
                } else if (layout === 'lower-third-card') {
                    // Bottom-left card with margin — leaves the right side clean
                    div.style.inset  = 'auto auto 6% 4%';
                    div.style.width  = '64%';
                    div.style.height = '32%';
                    div.style.borderRadius = '12px';
                    div.style.overflow = 'hidden';
                } else if (layout === 'corner-card') {
                    // Compact upper-right card — for quick quote pop-ins
                    div.style.inset  = '6% 4% auto auto';
                    div.style.width  = '38%';
                    div.style.height = '24%';
                    div.style.borderRadius = '10px';
                    div.style.overflow = 'hidden';
                } else if (layout === 'side-rail') {
                    // Full-height left rail
                    div.style.inset  = '0 auto 0 0';
                    div.style.width  = '32%';
                } else if (layout === 'split-left') {
                    // Full-height left half — verse panel, right half left clean
                    div.style.inset  = '0 auto 0 0';
                    div.style.width  = '50%';
                } else if (layout === 'split-right') {
                    // Full-height right half — verse panel, left half left clean
                    div.style.inset  = '0 0 0 auto';
                    div.style.width  = '50%';
                }

                // Free-canvas override (shapes / repositioned backgrounds).
                // Positioned shapes sit above the base background but below
                // text, interleaving with images by layer order.
                if (layer.pos) {
                    applyPos(div, layer.pos);
                    div.style.height  = (layer.pos.h / DESIGN_H * 100) + '%';
                    div.style.zIndex  = '1';
                    if (layer.radius) div.style.borderRadius = (layer.radius / DESIGN_H * 100) + 'vh';
                    if (layer.rotation) div.style.transform = `rotate(${layer.rotation}deg)`;
                }

                frag.appendChild(div);
                return;
            }

            if (layer.type === 'text') {
                // Per-slide override for this specific layer (by its stable
                // theme-defined id) — see buildLayerDOM's own comment.
                const ov = (styleByLayerId || {})[layer.id] || {};
                if (ov.visible === false) return;

                // Pick content for this layer
                let content = '';
                if (layer.binding === 'verse')     content = verseText;
                else if (layer.binding === 'verse_translated') content = translatedText || '';
                else if (layer.binding === 'reference') content = verseRef;
                else if (layer.binding === 'timer') content = timerText || '';
                else content = layer.customText || '';

                const div = document.createElement('div');
                div.className = 'display-layer';
                div.dataset.binding = layer.binding || 'custom';
                div.dataset.layerId = layer.id || '';

                // Field-by-field merges — a partial override (just font.size,
                // say) must not blow away the rest of the theme's settings.
                const fs = { ...layer.font, ...(ov.font || {}) };
                const shadow = ov.shadow ? { ...layer.shadow, ...ov.shadow } : layer.shadow;
                const outline = ov.outline ? { ...layer.outline, ...ov.outline } : layer.outline;
                const color = ov.color || layer.color;
                const opacity = ov.opacity ?? layer.opacity;
                const align = ov.align || layer.align;
                const shadowStr = shadow.enabled
                    ? `${shadow.x}px ${shadow.y}px ${shadow.blur}px ${hexOpacity(shadow.color, shadow.opacity)}`
                    : 'none';

                // A reference/translation caption with no verse line to
                // caption reads as orphaned floating text (e.g. just a song
                // title on an otherwise empty canvas) rather than theme-
                // controlled output — withhold it, same rule paintLookLayers
                // (service.js) applies for every preview. The div still gets
                // created (data-binding intact) so showVerse's in-place
                // update path below can reveal/re-hide it as verseText
                // changes, without a full rebuild every slide.
                const isCaptionOfVerse = hasVerseLayer && (layer.binding === 'reference' || layer.binding === 'verse_translated');

                div.style.cssText = `
                    position: absolute;
                    display: ${isCaptionOfVerse && !String(verseText || '').trim() ? 'none' : 'flex'};
                    flex-direction: column;
                    justify-content: center;
                    color: ${hexOpacity(color, opacity)};
                    font-family: '${fs.family}', system-ui, sans-serif;
                    font-size: ${fs.size}px;
                    font-weight: ${fs.weight};
                    font-style: ${fs.italic ? 'italic' : 'normal'};
                    line-height: ${fs.lineHeight};
                    letter-spacing: ${fs.letterSpacing}px;
                    text-transform: ${fs.transform};
                    text-align: ${align};
                    text-shadow: ${shadowStr};
                    z-index: 10;
                `;

                // Outline via webkit-text-stroke
                if (outline && outline.enabled) {
                    div.style.webkitTextStroke = `${outline.width}px ${outline.color}`;
                }

                // Timer state colours travel on the element so the per-second
                // 'action' tick (handleActionBadge) can recolour it as the
                // countdown enters warning / overtime — the theme owns all
                // three colours; these are just the classic defaults.
                if (layer.binding === 'timer') {
                    div.dataset.baseColor     = hexOpacity(color, opacity);
                    div.dataset.warnColor     = ov.warnColor     || layer.warnColor     || '#ffcf4d';
                    div.dataset.overtimeColor = ov.overtimeColor || layer.overtimeColor || '#ff5c5c';
                }

                // Positioning by layout
                if (layout === 'fullscreen') {
                    div.style.left  = '0';
                    div.style.right = '0';
                    div.style.padding = '0 8%';
                    if (layer.binding === 'verse') {
                        div.style.top       = '50%';
                        div.style.transform = 'translateY(-65%)';
                        div.style.maxWidth  = '100%';
                    } else if (layer.binding === 'reference') {
                        div.style.top       = '50%';
                        div.style.transform = 'translateY(40%)';
                    } else if (layer.binding === 'timer') {
                        div.style.left = 'auto'; div.style.right = '4%'; div.style.top = '5%';
                    } else {
                        div.style.top       = '50%';
                        div.style.transform = 'translateY(-50%)';
                    }
                } else if (layout === 'lower-third') {
                    div.style.left    = '0';
                    div.style.right   = '0';
                    div.style.padding = '0 6%';
                    if (layer.binding === 'verse') {
                        div.style.bottom = '14%';
                    } else if (layer.binding === 'reference') {
                        div.style.bottom = '5%';
                    } else if (layer.binding === 'timer') {
                        div.style.left = 'auto'; div.style.right = '4%'; div.style.bottom = 'auto'; div.style.top = '5%';
                    } else {
                        div.style.bottom = '10%';
                    }
                } else if (layout === 'ticker') {
                    div.style.left    = '0';
                    div.style.right   = '0';
                    div.style.bottom  = '3%';
                    div.style.padding = '0 3%';
                    div.style.whiteSpace    = 'nowrap';
                    div.style.overflow      = 'hidden';
                    div.style.textOverflow  = 'ellipsis';
                } else if (layout === 'scroll-fill') {
                    // Large scrolling text filling the whole screen — same
                    // marquee mechanism as the ticker above, just a full-height
                    // band instead of a thin strip at the bottom.
                    div.style.left    = '0';
                    div.style.right   = '0';
                    div.style.top     = '0';
                    div.style.bottom  = '0';
                    // Must NOT unconditionally force 'flex' here — that stomps
                    // the "no caption without a verse line" display:none the
                    // cssText block above just set for a reference/translated
                    // layer with no verse text, undoing that guard for any
                    // theme using this layout.
                    if (div.style.display !== 'none') div.style.display = 'flex';
                    div.style.alignItems = 'center';
                    div.style.whiteSpace = 'nowrap';
                    div.style.overflow   = 'hidden';
                    div.style.padding    = '0';
                } else if (layout === 'lower-third-card') {
                    // Text positioned inside the bottom-left card (matches bg insets)
                    div.style.left    = '4%';
                    div.style.width   = '64%';
                    div.style.padding = '0 3%';
                    if (layer.binding === 'verse') {
                        div.style.bottom = '14%';
                    } else if (layer.binding === 'reference') {
                        div.style.bottom = '32%';
                    } else {
                        div.style.bottom = '20%';
                    }
                } else if (layout === 'corner-card') {
                    // Text inside the upper-right compact card
                    div.style.right   = '4%';
                    div.style.width   = '38%';
                    div.style.padding = '0 3%';
                    if (layer.binding === 'reference') {
                        div.style.top = '8%';
                    } else if (layer.binding === 'verse') {
                        div.style.top = '15%';
                    } else {
                        div.style.top = '11%';
                    }
                } else if (layout === 'side-rail') {
                    // Text centered vertically inside the left rail
                    div.style.left    = '0';
                    div.style.width   = '32%';
                    div.style.padding = '0 3%';
                    if (layer.binding === 'verse') {
                        div.style.top       = '50%';
                        div.style.transform = 'translateY(-40%)';
                    } else if (layer.binding === 'reference') {
                        div.style.top       = '50%';
                        div.style.transform = 'translateY(60%)';
                    } else {
                        div.style.top       = '50%';
                        div.style.transform = 'translateY(-50%)';
                    }
                } else if (layout === 'multi-language') {
                    // Both languages share one frame, so — unlike plain
                    // split-left/right — which half a layer belongs to comes
                    // from its binding/id, not the layout as a whole.
                    // 'verse'/'ref' -> left; 'verse_translated'/'ref-translated' -> right.
                    const isRight = layer.binding === 'verse_translated' || layer.id === 'ref-translated';
                    div.style.width   = '50%';
                    div.style.padding = '0 4%';
                    if (isRight) div.style.right = '0'; else div.style.left = '0';
                    if (layer.binding === 'verse' || layer.binding === 'verse_translated') {
                        div.style.top       = '50%';
                        div.style.transform = 'translateY(-58%)';
                    } else {
                        div.style.top       = '50%';
                        div.style.transform = 'translateY(120%)';
                    }
                } else if (layout === 'split-left' || layout === 'split-right') {
                    // Text centered vertically inside the active half. Split-left
                    // pins the text column to the left edge; split-right to the right.
                    div.style.width   = '50%';
                    div.style.padding = '0 4%';
                    if (layout === 'split-left') div.style.left = '0'; else div.style.right = '0';
                    if (layer.binding === 'verse') {
                        div.style.top       = '50%';
                        div.style.transform = 'translateY(-58%)';
                    } else if (layer.binding === 'reference') {
                        div.style.top       = '50%';
                        div.style.transform = 'translateY(120%)';
                    } else if (layer.binding === 'timer') {
                        div.style.top = '5%';
                    } else {
                        div.style.top       = '50%';
                        div.style.transform = 'translateY(-50%)';
                    }
                }

                // Free-canvas override: explicit box wins over every layout rule.
                // A per-slide override box (ov.pos) wins over the theme's own —
                // it can also introduce free-canvas positioning for a layer that
                // otherwise only ever used a layout preset.
                const effectivePos = ov.pos || layer.pos;
                if (effectivePos) {
                    applyPos(div, effectivePos);
                    div.style.transform = 'none';
                    div.style.padding   = '0';
                }

                // Remember the designed size (already override-aware via `fs`
                // above) so auto-fit always shrinks from the intended size,
                // never from a previously-shrunk value. Also stash the
                // effective box so fitTextLayer's shrink budget matches
                // whatever box is actually rendered, override or not.
                div.dataset.baseSize = fs.size;
                if (effectivePos) div.dataset.effPos = JSON.stringify(effectivePos);
                else delete div.dataset.effPos;

                // Marquee scroll (news-ticker / large-scroll layers) — same
                // technique as Theme Studio's own preview (see renderPreview
                // in app.js): an inner span pushed off the right edge and
                // animated to -100%, so it crosses the whole band and loops
                // without needing to measure the text's actual width.
                if (layer.scroll?.enabled) {
                    div.style.whiteSpace   = 'nowrap';
                    div.style.overflow     = 'hidden';
                    div.style.textOverflow = 'clip';
                    const span = document.createElement('span');
                    span.style.display = 'inline-block';
                    span.style.paddingLeft = '100%';
                    span.style.animation = `kairo-marquee ${Math.max(1, layer.scroll.speed || 15)}s linear infinite`;
                    span.textContent = content;
                    div.appendChild(span);
                } else if (layer.binding === 'verse' && window.KairoWordSplit?.applyMotionText(div, look?.textAnimation, content, look?.textAnimationSpeed || 1, { color: look?.textHighlightColor, intensity: look?.textAnimationIntensity })) {
                    // handled
                } else {
                    div.textContent = content;
                }
                frag.appendChild(div);

                // Ensure font is loaded
                if (fs.family !== 'system-ui') loadGoogleFont(fs.family);
            }
        });

        return { frag, isTransparent };
    }

    // ── Auto-fit long verses ───────────────────────────────────────────────
    // Scripture verse length varies enormously — from "Jesus wept" (2 words) to
    // Esther 8:9 (~90 words, the longest verse in the Bible). A fixed font size
    // that looks right for a short verse overflows the stage on a long one,
    // especially inside a half-width split panel. After each render we measure
    // the verse element and shrink its font size (never grow past the theme's
    // designed size) until it fits the vertical space its layout allows.
    function fitVerse() {
        fitTextLayer('verse');
        fitTextLayer('verse_translated');
    }

    function fitTextLayer(binding) {
        const el = stage.querySelector(`[data-binding="${binding}"]`);
        if (!el) return;
        const layout = (activeLook || FALLBACK_LOOK).layout || 'fullscreen';
        const stageH = stage.clientHeight || window.innerHeight || 0;

        // Not laid out yet (0-size stage during load / detached window). Shrinking
        // against a bogus size would collapse the text to the floor — bail and let
        // the next render or the resize handler fit it once dimensions are real.
        if (stageH < 50 || stage.clientWidth < 50) return;

        // Free-canvas verse box: the budget is its own box height when set, or
        // the space from its top edge to the bottom of the stage when auto.
        // Read the EFFECTIVE box stashed on the element itself (buildLayerDOM's
        // `dataset.effPos`), not the theme's raw layer.pos — a per-slide
        // override can supply/replace this box entirely, and the shrink
        // budget must match whatever box is actually rendered.
        const p = el.dataset.effPos ? JSON.parse(el.dataset.effPos) : null;
        if (p) {
            const maxHpx = p.h > 0
                ? stageH * (p.h / 1080)
                : stageH * Math.max(0.08, 1 - p.y / 1080);
            const base = parseFloat(el.dataset.baseSize) || parseFloat(el.style.fontSize) || 48;
            let size = base;
            el.style.fontSize = size + 'px';
            // Measure unconstrained — a fixed-height box always reports
            // scrollHeight >= its height, which would shrink text to nothing.
            const prevH = el.style.height;
            el.style.height = 'auto';
            let guard = 60;
            while (el.scrollHeight > maxHpx && size > 14 && guard-- > 0) {
                size = Math.floor(size * 0.94);
                el.style.fontSize = size + 'px';
            }
            el.style.height = prevH;
            return;
        }

        // Fraction of stage height the verse is allowed to occupy per layout.
        const FRAC = {
            'lower-third': 0.30, 'lower-third-card': 0.24, 'corner-card': 0.20,
            'ticker': 0.16, 'side-rail': 0.80, 'split-left': 0.84, 'split-right': 0.84,
            'multi-language': 0.84,
        };
        const maxH = stageH * (FRAC[layout] || 0.72);

        const base = parseFloat(el.dataset.baseSize) || parseFloat(el.style.fontSize) || 48;
        let size = base;
        el.style.fontSize = size + 'px';

        // Shrink in ~6% steps until it fits or hits a legibility floor.
        let guard = 60;
        while (el.scrollHeight > maxH && size > 14 && guard-- > 0) {
            size = Math.floor(size * 0.94);
            el.style.fontSize = size + 'px';
        }
    }

    // ── Default fallback look (used if no look stored yet) ─────────────────
    const FALLBACK_LOOK = {
        id: 'default', name: 'Default', layout: 'fullscreen', animation: 'fade',
        layers: [
            { id: 'bg', type: 'background', name: 'Background', visible: true,
              fill: 'solid', color: '#000000', opacity: 100, color2: '#1a1a2e', angle: 160 },
            { id: 'verse', type: 'text', name: 'Verse Text', visible: true,
              binding: 'verse', customText: '',
              font: { family: 'Manrope', size: 56, weight: 500, italic: false, lineHeight: 1.35, letterSpacing: 0, transform: 'none' },
              color: '#ffffff', opacity: 100, align: 'center',
              shadow: { enabled: true, color: '#000000', opacity: 70, blur: 24, x: 0, y: 4 },
              outline: { enabled: false, color: '#000000', width: 2 } },
            { id: 'ref', type: 'text', name: 'Reference', visible: true,
              binding: 'reference', customText: '',
              font: { family: 'Manrope', size: 24, weight: 600, italic: false, lineHeight: 1.2, letterSpacing: 3, transform: 'uppercase' },
              color: '#ffffff', opacity: 55, align: 'center',
              shadow: { enabled: false, color: '#000000', opacity: 70, blur: 4, x: 0, y: 1 },
              outline: { enabled: false, color: '#000000', width: 1 } },
        ],
    };

    // ── Which output is this window? ───────────────────────────────────────
    // Each destination can be assigned its own theme in Settings (the
    // ProPresenter stage-vs-audience model). A display window declares which
    // output it represents via ?output=…; the default is the external display.
    const OUTPUT_KEY = (new URLSearchParams(location.search).get('output') || 'external').toLowerCase();

    // ── Load this output's look from localStorage ──────────────────────────
    function loadActiveLook() {
        try {
            const map = JSON.parse(localStorage.getItem('kairo-output-themes') || 'null');
            if (map && map[OUTPUT_KEY]) return map[OUTPUT_KEY];
        } catch {}
        try {
            const stored = localStorage.getItem('kairo-active-look');
            return stored ? JSON.parse(stored) : null;
        } catch { return null; }
    }

    // Pick this output's theme out of a broadcast payload.
    function pickLook(payload) {
        if (payload && payload.themes && payload.themes[OUTPUT_KEY]) return payload.themes[OUTPUT_KEY];
        return payload && payload.look ? payload.look : null;
    }

    // The theme configured for this output in Settings. Content-level overrides
    // (a playlist item's own theme) are temporary and revert to this.
    let assignedLook = null;

    function applyContentLook(look) {
        if (look) {
            if (activeLook !== look) applyLook(look, false);
        } else if (assignedLook && activeLook !== assignedLook) {
            applyLook(assignedLook, false);
        }
    }

    // ── Render the slide layer with current look + text ─────────────────────
    // Targets #slide-layer specifically, not the whole #stage — the media
    // layer behind it (an independently-sent image/video) must not fade or
    // clear just because the slide's text changed.
    function renderStage(verseText, verseRef, animate = true, translatedText = '', styleByLayerId = {}, timerText = '') {
        const look = activeLook || FALLBACK_LOOK;

        const doRender = () => {
            slideLayer.innerHTML = '';
            document.body.classList.remove('transparent-bg');

            // Nothing to actually show — leave the slide layer empty rather
            // than painting the theme's own background over the media layer
            // sitting behind it. Centralized here (not just in clearDisplay)
            // because applyLook() also calls this on every 'look-update'
            // broadcast (which fires on every Theme Studio autosave, i.e.
            // constantly while editing a theme) — clearing at boot alone
            // wasn't enough, since the very next look-update repainted the
            // "empty" background right back in, silently undoing it and
            // burying whatever media had been sent in the meantime.
            // A timer segment has no verse/reference at all, only timerText
            // — must NOT be treated as "nothing to show" just because those
            // two are blank.
            if (!verseText && !verseRef && !timerText) { fitVerse(); return; }

            const { frag, isTransparent } = buildLayerDOM(look, verseText, verseRef, translatedText, styleByLayerId, timerText);
            if (isTransparent) document.body.classList.add('transparent-bg');
            slideLayer.appendChild(frag);
            fitVerse();
        };

        // look.animation ('fade'/'slide-up'/'cut') picks the transition shape;
        // look.animationSpeed (a multiplier — 1 = the original fixed 300ms
        // this used to be hardcoded to, <1 faster, >1 slower) picks its pace.
        // Themes saved before either field existed fall back to exactly
        // today's old behavior (plain 300ms fade).
        const animType = look.animation || 'fade';
        const speedMs = Math.round(300 * (typeof look.animationSpeed === 'number' && look.animationSpeed > 0 ? look.animationSpeed : 1));

        // 'cut' skips this whole-slide-layer fade/slide choreography
        // entirely (and the synchronous offsetHeight forced-reflow below).
        // Text Animation (Word/Activate/Karaoke/etc, a separate per-theme
        // setting from this Transition — see KairoWordSplit's file header)
        // runs independently inside buildLayerDOM regardless of what
        // happens here; Fade/Slide + a Text Animation is a valid,
        // deliberate combination, not redundant.
        if (animate && animType === 'cut') {
            doRender();
        } else if (animate) {
            // Fade (+ slide, for 'slide-up') out → swap → fade (+ slide) in.
            // Reuses one shared element/transition for both halves — same
            // trick that made the plain opacity fade work without any extra
            // reflow step, now covering slide-up's transform too.
            const outY = animType === 'slide-up' ? '-16px' : '0px';
            slideLayer.style.transition = `opacity ${speedMs}ms ease, transform ${speedMs}ms ease`;
            slideLayer.style.opacity    = '0';
            slideLayer.style.transform  = animType === 'slide-up' ? `translateY(${outY})` : 'none';

            setTimeout(() => {
                doRender();
                if (animType === 'slide-up') {
                    // Land the new content NOT quite in place first (no
                    // transition yet, so this doesn't itself animate) —
                    // needs a real reflow before the transition below can
                    // actually play, unlike the opacity-only case which
                    // already had one from this same setTimeout gap.
                    slideLayer.style.transition = 'none';
                    slideLayer.style.transform  = 'translateY(16px)';
                    slideLayer.offsetHeight; // force layout
                    slideLayer.style.transition = `opacity ${speedMs}ms ease, transform ${speedMs}ms ease`;
                    slideLayer.style.transform  = 'none';
                }
                slideLayer.style.opacity = '1';
            }, speedMs + 20);
        } else {
            doRender();
        }
    }

    // ── Timer layer: the timer theme's OWN independent layer ──────────────
    // Renders the segment's full theme (background included) exactly as the
    // Edit view shows it — but on its own layer, NOT #slide-layer. So:
    //  • whether it overlays or covers the slide is the THEME's choice (a
    //    transparent/lower-third timer theme overlays; a full-bleed one
    //    covers) — not something forced here;
    //  • Clear Timer removes just this, and the scripture/lyrics on the
    //    slide layer are still there underneath, no re-send needed.
    // The per-second value arrives via the 'action' broadcast
    // (handleActionBadge writes into [data-binding="timer"], which lives in
    // this layer). renderTimerLayer runs once, at segment start.
    function renderTimerLayer(look, styleByLayerId, timerText) {
        timerLayer.innerHTML = '';
        timerLayer.classList.remove('transparent');
        if (!look) return;
        const { frag, isTransparent } = buildLayerDOM(look, '', '', '', styleByLayerId || {}, timerText || '');
        if (isTransparent) timerLayer.classList.add('transparent');
        timerLayer.appendChild(frag);
    }

    // ── Image slide: full-frame picture, bypassing the theme's text layers ──
    // Still honours the theme's canvas transparency, so an image slide over a
    // chroma/alpha rig keys the same way a verse slide would. This is a
    // slide-type item's own image (part of the slide layer) — not the
    // independent media layer; see renderMediaStage for that.
    function renderImageStage(src, animate = true, fit = 'contain') {
        const look = activeLook || FALLBACK_LOOK;
        const bg = (look.layers || []).find(l => l.type === 'background' && !l.pos);
        const isTransparent = !!(bg && bg.fill === 'transparent');

        const doRender = () => {
            slideLayer.innerHTML = '';
            document.body.classList.toggle('transparent-bg', isTransparent);
            const img = document.createElement('img');
            img.src = src;
            // object-fit accepts the literal 'fill' keyword natively — unlike
            // background-size (used elsewhere for layer.fit), no translation
            // to '100% 100%' is needed here.
            img.style.cssText = `position:absolute;inset:0;width:100%;height:100%;object-fit:${fit};`;
            slideLayer.appendChild(img);
        };

        if (animate) {
            slideLayer.style.transition = 'opacity 300ms ease';
            slideLayer.style.opacity    = '0';
            setTimeout(() => {
                doRender();
                slideLayer.style.opacity = '1';
            }, 320);
        } else {
            doRender();
        }
    }

    // ── Independent media layer: image or looping video, sent/cleared apart
    // from whatever the slide layer is showing. No native <video> controls —
    // this is the output the congregation sees; every control lives in the
    // operator's window and reaches here via WS (see handleMessage below).
    function renderMediaStage(src, kind, fit) {
        mediaLayer.innerHTML = '';
        if (!src) return;
        // object-fit accepts the literal 'fill' keyword natively (unlike
        // background-size, which needs the 100%/100% translation elsewhere
        // in this file) — inline style here wins over the CSS default
        // (object-fit:contain, see #media-layer img/video above), so a
        // sender that never passes fit keeps today's exact behavior.
        const objectFit = fit || 'contain';
        if (kind === 'video') {
            const v = document.createElement('video');
            v.src = src;
            v.autoplay = true;
            v.loop = true;
            v.muted = mediaMuted;
            v.volume = mediaVolume;
            v.playsInline = true;
            v.style.objectFit = objectFit;
            if (mediaSinkId && typeof v.setSinkId === 'function') {
                v.setSinkId(mediaSinkId).catch(() => {});
            }
            // Throttled status reports so the operator's window can drive a
            // real seek slider without polling — see server.js's ws.on('message').
            let lastReport = 0;
            v.addEventListener('timeupdate', () => {
                const now = Date.now();
                if (now - lastReport < 250) return;
                lastReport = now;
                reportMediaStatus(v);
            });
            v.addEventListener('play', () => reportMediaStatus(v));
            v.addEventListener('pause', () => reportMediaStatus(v));
            v.addEventListener('loadedmetadata', () => reportMediaStatus(v));
            mediaLayer.appendChild(v);
        } else {
            const img = document.createElement('img');
            img.src = src;
            img.style.objectFit = objectFit;
            mediaLayer.appendChild(img);
        }
    }

    function reportMediaStatus(v) {
        try {
            ws?.send(JSON.stringify({
                type: 'media-status',
                currentTime: v.currentTime, duration: v.duration || 0, paused: v.paused,
            }));
        } catch {}
    }

    function applyMediaControl(action, value) {
        const v = currentMediaVideo();
        if (action === 'mute') { mediaMuted = true; if (v) v.muted = true; }
        else if (action === 'unmute') { mediaMuted = false; if (v) v.muted = false; }
        else if (action === 'play') { if (v) v.play().catch(() => {}); }
        else if (action === 'pause') { if (v) v.pause(); }
        else if (action === 'seek') { if (v && typeof value === 'number') v.currentTime = value; }
        else if (action === 'volume') { mediaVolume = value; if (v) v.volume = value; }
    }

    async function applyAudioOutput(deviceId) {
        mediaSinkId = deviceId || null;
        const v = currentMediaVideo();
        if (v && mediaSinkId && typeof v.setSinkId === 'function') {
            try { await v.setSinkId(mediaSinkId); }
            catch (err) { console.warn('[KAIRO] setSinkId failed:', err.message); }
        }
    }

    // ── Update only the text content in existing layers (no re-render) ──────
    function updateTextContent(verseText, verseRef, translatedText = '', timerText = '') {
        // Same "no caption without a verse line" rule buildLayerDOM applies
        // at initial render — re-checked here so it still holds as verseText
        // changes slide-to-slide along this in-place (no-rebuild) path. Only
        // applies to themes that actually pair a caption with a verse layer;
        // a reference-only theme (no verse layer at all) always shows.
        const hasVerseLayer = (activeLook?.layers || []).some(l => l.type === 'text' && l.binding === 'verse' && l.visible !== false);
        const showCaptions = !hasVerseLayer || !!String(verseText || '').trim();
        // Use data-binding attributes to target the right divs
        stage.querySelectorAll('[data-binding="verse"]').forEach(el => {
            if (!window.KairoWordSplit?.applyMotionText(el, activeLook?.textAnimation, verseText, activeLook?.textAnimationSpeed || 1, { color: activeLook?.textHighlightColor, intensity: activeLook?.textAnimationIntensity })) {
                el.textContent = verseText;
            }
        });
        stage.querySelectorAll('[data-binding="verse_translated"]').forEach(el => {
            el.textContent = translatedText;
            el.style.display = showCaptions ? 'flex' : 'none';
        });
        stage.querySelectorAll('[data-binding="reference"]').forEach(el => {
            el.textContent = verseRef;
            el.style.display = showCaptions ? 'flex' : 'none';
        });
        // Only writes when a real value is passed — the per-second countdown
        // tick (handleActionBadge, below) writes into these same elements
        // far more often than any actual slide change does, and shouldn't
        // get blanked out by an ordinary verse update that has nothing to
        // do with the timer at all.
        if (timerText) {
            stage.querySelectorAll('[data-binding="timer"]').forEach(el => { el.textContent = timerText; });
        }
    }

    // ── Apply a new look (re-render with existing text) ────────────────────
    function applyLook(look, animate = true) {
        activeLook = look;
        renderStage(currentVerseText, currentVerseRef, animate, currentTranslatedText, currentStyleByLayerId, currentTimerText);
    }

    // ── Show verse (smart update: re-render on first verse, in-place after) ──
    function showVerse(text, ref, isRangeActive = false, translatedText = '', styleByLayerId = {}, timerText = '') {
        const wasEmpty = !currentVerseText && !currentVerseRef && !currentTimerText;
        // Also compare the style override — the exact same slide re-sent
        // after only tweaking its per-slide layout (Full Edit) must still
        // pick up the new override, not take the text-only in-place path
        // below (which never touches position/font).
        const styleChanged = JSON.stringify(styleByLayerId || {}) !== JSON.stringify(currentStyleByLayerId || {});
        const changed  = text !== currentVerseText || ref !== currentVerseRef || translatedText !== currentTranslatedText || styleChanged || timerText !== currentTimerText;
        currentVerseText = text;
        currentVerseRef  = ref;
        currentTranslatedText = translatedText;
        currentStyleByLayerId = styleByLayerId || {};
        currentTimerText = timerText;

        if (!changed) {
            if (isRangeActive) setRangeActive(true);
            return;
        }

        if (wasEmpty || stage.children.length === 0) {
            // First verse or blank stage — do a full render with fade
            renderStage(text, ref, true, translatedText, currentStyleByLayerId, timerText);
        } else if (styleChanged) {
            // Text unchanged but the layout override changed — the in-place
            // path below only ever swaps textContent, so a style-only change
            // needs the full rebuild too.
            renderStage(text, ref, true, translatedText, currentStyleByLayerId, timerText);
        } else {
            // Stage already has layers — fade (+ slide, for 'slide-up') text,
            // swap, fade back in. This in-place path (not renderStage, which
            // rebuilds the whole layer stack) is what actually runs for
            // every ordinary slide-to-slide change once the stage is
            // already showing something — a plain hardcoded 250ms opacity
            // fade here used to silently ignore whatever look.animation/
            // animationSpeed renderStage itself already respects, so a
            // theme like Lyrics — Motion never visibly animated in real use,
            // only on the very first slide of a service.
            const animType = (activeLook && activeLook.animation) || 'fade';
            const speedMs = Math.round(300 * ((activeLook && typeof activeLook.animationSpeed === 'number' && activeLook.animationSpeed > 0) ? activeLook.animationSpeed : 1));

            // 'cut' skips this whole-block opacity/transform choreography
            // entirely. Text Animation (a separate per-theme setting from
            // this Transition) still runs inside updateTextContent either
            // way — Fade/Slide + a Text Animation is a valid combination.
            if (animType === 'cut') {
                updateTextContent(text, ref, translatedText, timerText);
                fitVerse();
                if (isRangeActive) setRangeActive(true);
                return;
            }

            const textEls = stage.querySelectorAll('[data-binding]');
            textEls.forEach(el => {
                el.style.transition = `opacity ${speedMs}ms ease, transform ${speedMs}ms ease`;
                el.style.opacity    = '0';
                if (animType === 'slide-up') el.style.transform = 'translateY(-16px)';
            });

            setTimeout(() => {
                updateTextContent(text, ref, translatedText, timerText);
                fitVerse();
                if (animType === 'slide-up') {
                    // Same forced-reflow trick as renderStage's own slide-up
                    // path — land at the "below" starting point with no
                    // transition first, so animating back to place actually
                    // plays instead of jumping straight there.
                    textEls.forEach(el => { el.style.transition = 'none'; el.style.transform = 'translateY(16px)'; });
                    stage.offsetHeight; // force layout
                    textEls.forEach(el => { el.style.transition = `opacity ${speedMs}ms ease, transform ${speedMs}ms ease`; el.style.transform = 'none'; });
                }
                textEls.forEach(el => { el.style.opacity = ''; });
            }, speedMs + 10);
        }

        // Range active highlight
        if (isRangeActive) {
            setTimeout(() => setRangeActive(true), 320);
        }
    }

    // Genuinely empty — not renderStage('', '', true), which still paints
    // the theme's own background layer (opaque, by default) with just the
    // text missing. That's fine on its own, but it sits at a higher
    // z-index than the independent media layer, so an opaque "empty" slide
    // layer permanently hides any image/video sent there — clearing never
    // actually looked cleared once media was in the picture. Dropping the
    // slide layer's content entirely when there's nothing to show lets the
    // media layer show through, the same way a cleared front layer in
    // ProPresenter reveals whatever's behind it.
    function clearDisplay() {
        currentVerseText = '';
        currentVerseRef  = '';
        currentTranslatedText = '';
        currentStyleByLayerId = {};
        renderStage('', '', true); // renderStage itself leaves the layer empty for blank text
    }

    function setRangeActive(active) {
        // Target text layers specifically (they have data-binding)
        stage.querySelectorAll('[data-binding]').forEach(el => {
            el.style.filter = active ? 'brightness(1.18)' : '';
        });
    }

    // ── Storage event → look updated from main window ─────────────────────
    window.addEventListener('storage', (e) => {
        if (e.key === 'kairo-output-themes' && e.newValue) {
            try {
                const map = JSON.parse(e.newValue);
                if (map && map[OUTPUT_KEY]) { assignedLook = map[OUTPUT_KEY]; applyLook(assignedLook, true); return; }
            } catch {}
        }
        if (e.key === 'kairo-active-look' && e.newValue) {
            try {
                assignedLook = JSON.parse(e.newValue);
                applyLook(assignedLook, true);
            } catch {}
        }
    });

    // Re-fit when the output window resizes (projector attach, fullscreen toggle).
    window.addEventListener('resize', () => { try { fitVerse(); } catch {} });

    // ── F key → fullscreen ─────────────────────────────────────────────────
    document.addEventListener('keydown', (e) => {
        if (e.key === 'f' || e.key === 'F') {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen?.();
            } else {
                document.exitFullscreen?.();
            }
        }
    });

    // ── WebSocket ──────────────────────────────────────────────────────────
    function connect() {
        if (ws) { try { ws.close(); } catch {} ws = null; }

        setConnStatus('reconnecting', 'Connecting…');

        try { ws = new WebSocket(authedWsUrl()); }
        catch { scheduleReconnect(); return; }

        ws.onopen = () => {
            clearTimeout(reconnectTimer);
            reconnectAttempts = 0;
            setConnStatus('connected', '');
            setTimeout(() => connStatus.classList.remove('visible'), 1500);
        };

        ws.onmessage = (event) => {
            let msg;
            try { msg = JSON.parse(event.data); } catch { return; }
            handleMessage(msg);
        };

        ws.onerror = () => {};

        ws.onclose = () => {
            ws = null;
            setConnStatus('reconnecting', 'Reconnecting…');
            connStatus.classList.add('visible');
            scheduleReconnect();
        };
    }

    function scheduleReconnect() {
        clearTimeout(reconnectTimer);
        const delay = Math.min(RECONNECT_BASE_DELAY * 1.6 ** reconnectAttempts, RECONNECT_MAX_DELAY) + Math.random() * 300;
        reconnectAttempts++;
        reconnectTimer = setTimeout(connect, delay);
    }

    function setConnStatus(cls, text) {
        connStatus.className = `visible ${cls}`;
        connStatus.textContent = text;
    }

    // ── Message handler ────────────────────────────────────────────────────
    function handleMessage(msg) {
        if (msg.type === 'detection' && msg.target === 'viewer') {
            const verse = msg.verses && msg.verses[0];
            if (verse) {
                // A playlist item may carry its own theme (lyrics vs scripture).
                // Anything without one falls back to this output's assigned theme.
                applyContentLook(msg.look);
                if (verse.image) {
                    // Image slides bypass the text layers entirely — there is no
                    // verse text to bind, just the picture, full-frame.
                    currentVerseText = '';
                    currentVerseRef  = verse.reference || verse.ref || '';
                    renderImageStage(verse.image, true, verse.fit || 'contain');
                } else {
                    showVerse(verse.text || verse.verse || '', verse.reference || verse.ref || '', false, verse.translatedText || '', verse.slideStyle || {}, verse.timerText || '');
                }
            }
            return;
        }

        if (msg.type === 'range-active') {
            const verse = msg.verses && msg.verses[0];
            if (verse) {
                showVerse(verse.text || verse.verse || '', verse.reference || verse.ref || '', true, verse.translatedText || '');
            } else {
                setRangeActive(true);
            }
            return;
        }

        if (msg.type === 'range-end') {
            setRangeActive(false);
            return;
        }

        // Legacy whole-stage clear — nothing sends this anymore (clear-layer
        // with layer:'all' replaced it) but keep it as an alias in case
        // anything external still posts the old shape.
        if (msg.type === 'clear') {
            clearDisplay();
            renderMediaStage(null);
            return;
        }

        if (msg.type === 'clear-layer') {
            if (msg.layer === 'slide' || msg.layer === 'all') clearDisplay();
            if (msg.layer === 'media' || msg.layer === 'all') renderMediaStage(null);
            // Cosmetic only — the server-side clear-timer/clear-all handlers
            // actually stop the live segment's trigger *before* sending this,
            // so nothing broadcasts a fresh remainingMs a moment later to
            // silently bring the badge back.
            if (msg.layer === 'timer' || msg.layer === 'all') {
                timerBadgeEl?.classList.add('hidden');
                clockBadgeEl?.classList.add('hidden');
                if (timerLayer) timerLayer.innerHTML = ''; // clear the full-screen countdown too
            }
            return;
        }

        if (msg.type === 'media' && msg.target === 'viewer') {
            renderMediaStage(msg.src, msg.kind, msg.fit);
            return;
        }

        // A segment went live — paint its themed countdown into the
        // independent timer layer (or clear it). The slide layer is left
        // exactly as it was.
        if (msg.type === 'timer-slide') {
            // Uses the look carried in the message directly — never touches
            // activeLook, so the slide layer's own theme is unaffected.
            if (msg.clear) { timerLayer.innerHTML = ''; }
            else renderTimerLayer(msg.look, msg.style || {}, msg.timerText || '0:00');
            return;
        }

        if (msg.type === 'media-control') {
            applyMediaControl(msg.action, msg.value);
            return;
        }

        if (msg.type === 'audio-output') {
            applyAudioOutput(msg.deviceId);
            return;
        }

        // look-update: main window broadcasts theme assignments. Take the entry
        // for this output, or the single look in the legacy payload shape.
        if (msg.type === 'look-update') {
            const mine = pickLook(msg);
            if (mine) { assignedLook = mine; try { applyLook(mine, true); } catch {} }
            return;
        }

        // Generic action/trigger broadcast (server/triggers.js) — a
        // segment's stage-timer countdown or the system-clock message.
        // Two independent badges (see #timer-badge/#clock-badge above),
        // not one shared slot, so both can be showing at once without
        // overwriting each other every tick.
        if (msg.type === 'action') {
            handleActionBadge(msg);
            return;
        }
    }

    const timerBadgeEl = document.getElementById('timer-badge');
    const clockBadgeEl = document.getElementById('clock-badge');
    function formatMs(ms) {
        const totalSec = Math.max(0, Math.ceil(ms / 1000));
        const m = Math.floor(totalSec / 60);
        const s = totalSec % 60;
        return `${m}:${String(s).padStart(2, '0')}`;
    }
    function handleActionBadge(msg) {
        if (msg.actionId === 'stage-timer') {
            const { remainingMs, label, cleared, style } = msg.payload || {};
            // Two independent render targets share this one tick: the fixed
            // corner badge (always available, no theme needed) and — if this
            // segment was actually sent to the slide layer with a theme that
            // has a real 'timer'-bound layer (sendSlide/toggleSegment in
            // service.js) — that on-stage layer too. Both need to clear on
            // an explicit stop, so that has to happen before either one's
            // early-return, not stop at the badge and leave the on-stage
            // layer frozen on its last value forever.
            const overtime = remainingMs < 0;
            // Inside the last minute but not yet at zero — a heads-up step
            // before overtime, not just a jump from plain to red at 0:00.
            const warning = !overtime && remainingMs <= 60000;
            const formatted = cleared ? '' : (overtime ? '+' : '') + formatMs(Math.abs(remainingMs));
            // The themed on-stage layer needs the same warning/overtime
            // treatment as the fixed corner badge below — it was only
            // getting a textContent update before, so a themed timer (any
            // color chosen in Full-scale edit) stayed that color forever
            // instead of ever changing as the countdown ran down.
            stage.querySelectorAll('[data-binding="timer"]').forEach(el => {
                el.textContent = formatted;
                el.classList.toggle('is-overtime', overtime && !cleared);
                el.classList.toggle('is-warning', warning && !cleared);
                // Recolour to the theme's warning / overtime colour (or the
                // base colour otherwise) — the countdown going red at 0 is
                // half the point of a stage timer.
                const base = el.dataset.baseColor;
                if (base) {
                    el.style.color = cleared ? base
                        : overtime ? (el.dataset.overtimeColor || '#ff5c5c')
                        : warning  ? (el.dataset.warnColor || '#ffcf4d')
                        : base;
                }
            });
            currentTimerText = formatted;

            if (!timerBadgeEl) return;
            if (cleared) { timerBadgeEl.classList.add('hidden'); return; }
            timerBadgeEl.classList.remove('hidden');
            // Overtime, not "ended" — the countdown keeps going past zero
            // (see triggers.js) until the operator actually stops it, so it
            // switches to counting up in red instead of just disappearing.
            timerBadgeEl.classList.toggle('is-overtime', overtime);
            timerBadgeEl.classList.toggle('is-warning', warning);
            // A custom font style is per-segment (see the countdown-style
            // popover in service.js); warning/overtime color always wins
            // over it — clearing the inline color lets the .is-warning /
            // .is-overtime CSS rules apply instead of a same-priority
            // inline color fighting them.
            timerBadgeEl.style.fontFamily = style?.fontFamily || '';
            timerBadgeEl.style.fontSize   = style?.fontSize ? style.fontSize + 'px' : '';
            timerBadgeEl.style.fontWeight = style?.fontWeight || '';
            timerBadgeEl.style.color      = (!overtime && !warning && style?.color) ? style.color : '';
            // No segment name in the output — the congregation just needs the
            // number. (Operator still sees which segment is live in-app.)
            timerBadgeEl.textContent = formatted;
        } else if (msg.actionId === 'clock-message') {
            if (!clockBadgeEl) return;
            const { now, format, cleared } = msg.payload || {};
            if (cleared) { clockBadgeEl.classList.add('hidden'); return; }
            const d = new Date(now || Date.now());
            const text = format === '12h' ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
                                           : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
            clockBadgeEl.classList.remove('hidden');
            clockBadgeEl.textContent = text;
        }
    }

    // ── Boot ───────────────────────────────────────────────────────────────
    // 1. Load active look from localStorage
    activeLook = loadActiveLook() || FALLBACK_LOOK;
    assignedLook = activeLook;   // baseline this output reverts to

    // 2. Start genuinely blank — nothing painted yet, not even the theme's
    // background — until the first real slide/verse actually arrives. See
    // renderStage's comment for why an eagerly-painted empty slide layer
    // is a problem now that there's a media layer behind it.

    // 3. Connect WebSocket (after the auth token is loaded so the upgrade
    //    URL carries it; falls back to unauthed when not running under Tauri).
    loadAuthToken().finally(connect);

    // 4. Reveal the window now that its own dark CSS has actually settled.
    // openDisplayWindow (index.html) creates this window hidden — same
    // fix as the main window's own splash->show sequence, same reason: a
    // window visible immediately by default shows WebKit's default WHITE
    // background before this page's CSS paints, which on the actual
    // output screen read as a black/white/black flash on every open. A
    // short timer, not requestAnimationFrame — an invisible surface never
    // gets a compositing pass to synchronize against, so rAF here would
    // simply never fire (confirmed the hard way on the main window).
    setTimeout(() => {
        const w = window.__TAURI__?.window?.getCurrentWindow?.();
        w?.show().catch(() => {});
    }, 50);
    </script>
</body>
</html>
