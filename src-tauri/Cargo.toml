[package]
name = "kairo"
version = "2.7.0"
description = "KAIRO — AI Scripture Assistant"
authors = ["KAIRO"]
edition = "2021"

[lib]
name = "kairo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["webview-data-url"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# "Paste from clipboard" imports (service.js's quickImportClipboard) used
# plain navigator.clipboard.readText() — the web Clipboard API, which a
# Tauri webview never grants without this plugin, so it silently threw every
# time and the operator was dumped into the manual paste-textarea fallback
# on EVERY use, not just when the OS clipboard genuinely couldn't be read.
tauri-plugin-clipboard-manager = "2"
# Suppresses WRY's own native right-click menu (Reload/Inspect Element) —
# in a dev/debug build that menu wins over the page's contextmenu listener
# unconditionally, no matter what the JS does (confirmed: preventDefault()
# has no effect on it), so the app's own custom menu (Quick edit/Rename/
# Edit/Duplicate/Delete — Timer, Slides, Songs, Media cards) never even
# got a chance to show. Only CONTEXT_MENU is disabled — Cmd+Option+I still
# opens devtools directly, this just stops right-click from being
# intercepted before the page ever sees it.
tauri-plugin-prevent-default = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"] }
tokio = { version = "1", features = ["time"] }
base64 = "0.22"
getrandom = "0.2"

# NDI native sender — links to libndi.dylib/dll/so at runtime via libloading.
# We don't bundle the NDI SDK; KAIRO finds libndi on the user's system from
# the standard NDI Tools / NDI SDK install paths. Renders verse/media/timer
# frames in pure Rust (no webview capture) so this works headless.
libloading = "0.8"
tiny-skia  = "0.11"
cosmic-text = "0.12"
crossbeam-channel = "0.5"
# Decodes Media-layer images for the NDI/Syphon renderers (Output Looks —
# see ndi.rs/syphon.rs render_frame). png+jpeg only: every real Media import
# in this app is one of those two (server/slide_import.js's own media
# handling); trimmed feature set keeps compile time/binary size down.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# ── macOS-only: Syphon native sender ─────────────────────────────────────
# Syphon publishes via OpenGL textures shared through IOSurface. We use
# objc2 to talk to Cocoa + the bundled Syphon.framework; gl_loader / gl
# for the CGL context and texture upload. All macOS-gated so non-Mac
# builds (Linux .deb / Windows .msi) skip these entirely.
[target.'cfg(target_os = "macos")'.dependencies]
objc2            = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSDictionary", "NSValue", "NSGeometry"] }
core-foundation  = "0.10"
gl               = "0.14"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Proc-macro/build-script crates are host tooling, not shipped code — LTO +
# strip on them (inherited from [profile.release] by default) was producing
# a proc-macro dylib rustc couldn't load ("can't find crate for X_derive").
[profile.release.build-override]
opt-level = 0
strip = false
