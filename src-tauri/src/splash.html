<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KAIRO</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }

  body {
    background: linear-gradient(180deg, #131313 0%, #0a0a0a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #fff;
    -webkit-app-region: drag;
  }

  /* Same lockup (mark + "KAIRO" wordmark) as the in-app bootstrap overlay
     (src/index.html) — this native splash is a separate window baked into
     the Rust binary (see splash_data_url() in lib.rs) so it can render
     before the main webview even exists, which means it can't share that
     page's CSS/assets and needs its own self-contained copy. Keep both in
     sync if the mark ever changes. */
  .mark {
    width: 72px;
    height: auto;
  }

  .wordmark {
    font-size: 44px;
    font-weight: 800;
    letter-spacing: 0.16em;
    line-height: 1;
  }

  .tagline {
    font-size: 10px;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: #888;
    margin-top: -10px;
  }

  .dots {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #F5301A;
    animation: pulse 1.3s ease-in-out infinite;
    opacity: 0.3;
  }
  .dot:nth-child(2) { animation-delay: 0.18s; }
  .dot:nth-child(3) { animation-delay: 0.36s; }

  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40%           { opacity: 1;   transform: scale(1.0); }
  }

  .status {
    font-size: 9.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #555;
    margin-top: 4px;
    font-weight: 500;
  }
</style>
</head>
